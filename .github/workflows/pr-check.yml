name: PR Check

on:
  pull_request:

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify code quality
        run: pnpm verify

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:pr

  windows-archive-coordination:
    name: Windows Archive Coordination
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify code quality on Windows
        run: pnpm verify

      - name: Build packages on Windows
        run: pnpm build

      - name: Run Windows archive replacement tests
        run: >-
          pnpm exec vitest run
          test/core/storage/wikg/archive-coordination.test.ts
          test/core/storage/wikg/opaque-file-adapter.test.ts
          test/core/runtime/platform/node-platform.test.ts
          packages/sdk/src/full-regression/delivery.full-regression.test.ts
          -t "keeps the archive owner registered until its ZIP reader closes|waits for an active standalone archive reader before replacing|supports database and ZIP access below a long Windows path|supports concurrent WAL readers below a long Windows path|supports concurrent WAL readers through repeated opens|appends multiple chunks to an existing file before replacing it|preserves the original when the append reader cannot close|closes the append reader when the writer cannot open|does not replace a file when its append reader fails|appends to a new file after an explicit missing-file error|closes source readers after streaming entries and before replacing the ZIP|aborts ZIP publication when releasing source resources fails|keeps the archive intact when the host ZIP commit fails"
          --maxWorkers=1
          --config vitest.config.ts

  package-readiness:
    name: End-to-End and Package Readiness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Run packed CLI end-to-end tests
        run: pnpm test:e2e:run

      - name: Smoke test packed install
        run: pnpm smoke:pack-install

      - name: Validate CLI publish dry run
        run: pnpm publish:dry-run:cli

      - name: Validate core publish dry run
        run: pnpm publish:dry-run:core
