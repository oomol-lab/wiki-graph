name: Release

on:
  workflow_dispatch:
    inputs:
      authentication:
        description: npm publishing authentication
        type: choice
        required: true
        default: trusted-publishing
        options:
          - trusted-publishing
          - bootstrap-token

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Install OIDC-compatible npm
        run: npm install --global npm@11.20.0

      - name: Ensure release runs from main
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Release must run from main, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify code quality
        run: pnpm verify

      - name: Build packages
        run: pnpm build

      - name: Smoke test packed installation
        run: pnpm smoke:pack-install

      - name: Publish missing packages with trusted publishing
        if: inputs.authentication == 'trusted-publishing'
        run: pnpm release:packages --publish

      - name: Publish missing packages with bootstrap token
        if: inputs.authentication == 'bootstrap-token'
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "The NPM_TOKEN Actions secret is required for bootstrap publishing" >&2
            exit 1
          fi
          pnpm release:packages --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release tag
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          TAG="v${VERSION}"
          TAG_COMMIT="$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)"
          if [ -n "${TAG_COMMIT}" ]; then
            if [ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already points to ${TAG_COMMIT}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "Tag ${TAG} already points to this release commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"
