name: Full Regression

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

concurrency:
  group: full-regression-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Full regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite
        run: pnpm test:full-regression
        env:
          WIKIGRAPH_REGRESSION_TRACE: "1"

      - name: Build packages
        run: pnpm build

      - name: Run packed end-to-end suite
        run: pnpm test:e2e:run
